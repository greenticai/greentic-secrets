name: Secrets Validator Component

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95 with wasm target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y jq rsync zip; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
            echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
            sleep 15
          done

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: |
          token="${GHCR_TOKEN:-${GH_FALLBACK_TOKEN}}"
          echo "${token}" | oras login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Publish validator component to GHCR
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: ./scripts/publish-validators.sh

      - name: Build validator pack
        run: ./scripts/build-validator-pack.sh

      - name: Upload validator pack
        uses: actions/upload-artifact@v4
        with:
          name: validators-secrets-pack
          path: dist/validators-secrets.gtpack
